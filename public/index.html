<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GEARO - AI Companion on the Grand Line</title>
<meta name="description" content="GEARO is a One Piece themed AI assistant with live web search, file upload and image creation.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--acc:#ffd166;--panel:rgba(34,10,32,.62);--fg:#fff;--dim:.1;color-scheme:dark}
body.light{--panel:rgba(255,255,255,.72);--fg:#1a1a1a;color-scheme:light}
html,body{height:100%}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#111;color:var(--fg);overflow:hidden}
#bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:72% center}
#bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--dim))}
#cap{position:fixed;z-index:1;left:300px;top:12%;font:clamp(30px,5vw,68px)/.95 "Permanent Marker","Impact",fantasy;color:#fff;transform:rotate(-7deg);text-shadow:3px 4px 0 rgba(0,0,0,.45),0 0 24px rgba(0,0,0,.5);max-width:30vw;pointer-events:none;text-transform:uppercase}
#wrap{position:relative;z-index:2;height:100%;display:flex}
#side{width:260px;flex:none;margin:10px;padding:14px;border-radius:26px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.logo{text-align:center;font-size:44px;line-height:1}
.name{text-align:center;font-weight:800;font-size:34px;letter-spacing:.04em}
.name small{font-size:13px;color:var(--acc);margin-left:4px}
.tag{text-align:center;font-style:italic;font-size:13px;opacity:.85;margin-bottom:10px}
.nav{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;border:0;background:transparent;color:inherit;font-size:15px;cursor:pointer;text-align:left}
.nav.on,.nav:hover{background:linear-gradient(90deg,rgba(255,60,80,.55),rgba(160,40,120,.35))}
.sp{flex:1}
.box{position:relative;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);padding:10px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:10px}
.box b{display:block;font-size:14px}
#menu{position:absolute;bottom:105%;left:0;right:0;background:rgba(15,8,20,.95);border-radius:14px;padding:6px;display:none;z-index:5;color:#fff}
#menu.show{display:block}
#menu div{padding:8px 10px;border-radius:8px;cursor:pointer}
#menu div:hover,#menu div.on{background:rgba(255,255,255,.15)}
#main{flex:1;min-width:0;display:flex;flex-direction:column;padding:10px 14px;max-width:1000px;margin:0 auto}
#top{display:flex;justify-content:flex-end;align-items:center;gap:8px}
.pill,.ib{border:1px solid rgba(255,255,255,.3);background:var(--panel);color:var(--fg);border-radius:99px;backdrop-filter:blur(10px);font-size:14px;padding:8px 14px;cursor:pointer}
.ib{width:42px;height:42px;padding:0;font-size:18px;flex:none;border-radius:50%}
#burger{display:none;margin-right:auto}
#chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:10px 2px}
.m{max-width:88%;padding:10px 13px;border-radius:16px;background:var(--panel);backdrop-filter:blur(10px);line-height:1.45;font-size:15px;white-space:pre-wrap;word-wrap:break-word;align-self:flex-start}
.m.u{align-self:flex-end;background:var(--acc);color:#111}
.m img{max-width:100%;border-radius:10px;background:#fff;display:block;margin:6px 0}
.card{border-radius:26px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25);padding:16px;text-align:center}
#welcome h2{margin:0;font-size:clamp(22px,4vw,34px)}
#welcome h2 span{color:var(--acc)}
#welcome p{margin:6px 0 12px;opacity:.85;font-style:italic}
.qs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.q{border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:inherit;padding:9px 14px;border-radius:99px;font-size:14px;cursor:pointer}
.q:hover{background:var(--acc);color:#111}
#files{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
#bar{display:flex;gap:8px;align-items:flex-end;margin-top:10px;padding:8px;border-radius:30px;background:var(--panel);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.25)}
#bar .ib{border:0;background:transparent}
#bar #send{background:#e63946;color:#fff}
#bar .ib.on{background:var(--acc);color:#111}
textarea{flex:1;resize:none;max-height:110px;border:0;outline:0;background:transparent;color:inherit;font:inherit;font-size:15px;padding:10px 4px}
#foot{text-align:center;font-size:12px;opacity:.85;margin-top:8px;text-shadow:0 1px 6px #000}
#modal{position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px}
#modal.show{display:flex}
#mbox{width:min(460px,100%);max-height:80%;overflow-y:auto;text-align:left}
#mbox h3{margin:0 0 10px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.08);margin-bottom:6px;cursor:pointer}
.sm{border:1px solid rgba(255,255,255,.4);background:transparent;color:inherit;border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
@media(max-width:760px){
#side{position:fixed;left:0;top:env(safe-area-inset-top,0px);bottom:0;z-index:6;transform:translateX(-110%);transition:transform .25s;background:rgba(15,6,20,.94);color:#fff}
#side.open{transform:none}
#burger{display:block}
#cap{left:5vw;top:9%;max-width:80vw;font-size:clamp(26px,9vw,44px)}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="cap"></div>
<div id="wrap">
<aside id="side">
  <div class="logo">🏴‍☠️</div>
  <div class="name">GEARO<small>1.0</small></div>
  <div class="tag">Your AI Companion<br>on the Grand Line</div>
  <button class="nav on" id="nNew">💬 New Chat</button>
  <button class="nav" id="nHist">🕘 Chat History</button>
  <button class="nav" id="nUp">📎 Upload File</button>
  <button class="nav" id="nSet">⚙️ Settings</button>
  <button class="nav" id="nAbout">ℹ️ About GEARO</button>
  <div class="sp"></div>
  <div class="box" id="tbox"><div id="menu"></div><span style="font-size:24px">👒</span><div style="flex:1"><span style="opacity:.8">Crew Theme</span><b id="tname">Luffy</b></div><span>⌄</span></div>
  <div class="box"><span style="font-size:24px">👤</span><div><b>Guest User</b>Sign In</div></div>
</aside>
<main id="main">
  <div id="top"><button class="ib" id="burger">☰</button><span class="pill">✨ GEARO 1.0</span><button class="ib" id="mode">🌙</button></div>
  <div id="chat"></div>
  <div id="welcome" class="card">
    <h2>Welcome to <span>GEARO</span>!</h2>
    <p>Ask anything, explore ideas, or get help — I’m here for you!</p>
    <div class="qs">
      <button class="q" data-p="Explain this topic: ">✨ Explain this topic</button>
      <button class="q" data-p="Help me study: ">📖 Study help</button>
      <button class="q" data-p="Write code for: ">&lt;&gt; Write code</button>
      <button class="q" data-p="Give me ideas for: ">💡 Give ideas</button>
      <button class="q" data-img="1">🎨 Create image</button>
    </div>
  </div>
  <div id="files"></div>
  <div id="bar">
    <button class="ib" id="attach" title="Upload files">📎</button>
    <textarea id="in" rows="1" placeholder="Type your message to GEARO..."></textarea>
    <button class="ib" id="img" title="Create image">🎨</button>
    <button class="ib" id="send">➤</button>
  </div>
  <div id="foot">Navigate Knowledge · Conquer Your Goals</div>
</main>
</div>
<div id="modal"><div class="card" id="mbox"></div></div>
<input type="file" id="fin" multiple hidden>
<input type="file" id="bin" accept="image/*" hidden>
<input type="file" id="tin" accept="image/*" hidden>
<script>
const IMGS={"luffy": "bg/luffy.jpg", "zoro": "bg/zoro.jpg", "sanji": "bg/sanji.jpg", "shanks": "bg/shanks.jpg", "law": "bg/law.jpg", "doflamingo": "bg/doflamingo.jpg"};const POS={"luffy": "50%", "zoro": "55%", "sanji": "72%", "shanks": "50%", "law": "50%", "doflamingo": "45%"};
const T=[
{id:"luffy",n:"Luffy",c:"Dream bigger!",a:"#ffd166",bg:"radial-gradient(circle at 50% 70%,#fff3b0 0 8%,#ffd166 9% 18%,transparent 19%),linear-gradient(#e63946,#ff8c42 58%,#1d4e89 59%,#0b2545)"},
{id:"zoro",n:"Zoro",c:"Never lose your way.",a:"#7cfc9a",bg:"linear-gradient(115deg,transparent 38%,rgba(255,255,255,.6) 38.3%,transparent 38.7%),linear-gradient(125deg,transparent 46%,rgba(255,255,255,.5) 46.3%,transparent 46.6%),linear-gradient(160deg,#071a10,#1b7f3b 60%,#04100a)"},
{id:"shanks",n:"Shanks",c:"Be calm. Be crowned.",a:"#ff6b6b",bg:"radial-gradient(ellipse at 50% 0,rgba(255,80,80,.45),transparent 60%),linear-gradient(#1a0508,#7a0c0c 70%,#240707)"},
{id:"sanji",n:"Sanji",c:"Cook up a storm!",a:"#4cc9f0",bg:"radial-gradient(ellipse at 50% 118%,#ff9f1c 0 18%,#ff5400 28%,transparent 55%),linear-gradient(160deg,#05070f,#1d4ed8 60%,#0a1a3a)"},
{id:"law",n:"Law",c:"Cut the odds.",a:"#ffd60a",bg:"radial-gradient(circle at 70% 30%,rgba(255,214,10,.28) 0 26%,transparent 27%),linear-gradient(160deg,#0d0d0d,#2b2b2b)"},
{id:"doflamingo",n:"Doflamingo",c:"Pull the strings.",a:"#ff6ec7",bg:"repeating-linear-gradient(80deg,transparent 0 22px,rgba(255,255,255,.1) 22px 23px),linear-gradient(160deg,#16041a,#b3126b 65%,#3a0a3a)"}
];
const $=s=>document.querySelector(s),root=document.documentElement.style;
const chat=$("#chat"),inp=$("#in"),bg=$("#bg");
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
let cur="luffy",custom=null,msgs=[],hist=[],pend=[],imgMode=false,sample=null,caps=null,chats=[],cid=null;
try{chats=JSON.parse(ls.g("gearo-chats")||"[]")}catch(e){chats=[]}
root.setProperty("--dim",ls.g("gearo-dim")||".1");

function theme(id){
  const t=T.find(x=>x.id===id)||T[0];cur=t.id;root.setProperty("--acc",t.a);
  const im=ls.g("gearo-img-"+t.id)||IMGS[t.id];bg.style.background=custom?"center/cover url("+custom+")":im?(POS[t.id]||"50%")+" center/cover url("+im+"), "+t.bg:t.bg;
  $("#cap").textContent=custom?"Your legend":t.c;$("#tname").textContent=t.n;
}
function buildMenu(){const m=$("#menu");m.innerHTML="";
  T.forEach(t=>{const d=document.createElement("div");d.textContent=t.n;if(t.id===cur)d.className="on";
    d.onclick=e=>{e.stopPropagation();custom=null;theme(t.id);m.classList.remove("show")};m.append(d)})}
$("#tbox").onclick=()=>{buildMenu();const m=$("#menu"),s=document.createElement("div");s.textContent="🖼️ Set character image for this theme";s.onclick=e=>{e.stopPropagation();m.classList.remove("show");tgt=cur;$("#tin").click()};m.append(s);m.classList.toggle("show")};
$("#mode").onclick=()=>{const l=document.body.classList.toggle("light");$("#mode").textContent=l?"☀️":"🌙"};
$("#burger").onclick=()=>$("#side").classList.toggle("open");
function pickBg(){$("#bin").click()}
$("#bin").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{custom=r.result;theme(cur)};r.readAsDataURL(f);e.target.value=""};
let tgt="luffy";
$("#tin").onchange=e=>{const f=e.target.files[0];e.target.value="";if(!f)return;const im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",.82);try{localStorage.setItem("gearo-img-"+tgt,d)}catch(x){IMGS[tgt]=d}custom=null;theme(tgt)};im.src=URL.createObjectURL(f)};
theme("luffy");

function modal(html,setup){const b=$("#mbox");b.innerHTML=html;$("#modal").classList.add("show");setup&&setup(b)}
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("show")};
function save(){if(!msgs.length)return;let c=chats.find(x=>x.id===cid);
  if(!c){cid=Date.now();c={id:cid,title:msgs[0].text.slice(0,40)||"Chat",msgs:[]};chats.unshift(c)}
  c.msgs=msgs.map(m=>m.img?{role:m.role,text:"[Image created]"}:m);ls.s("gearo-chats",JSON.stringify(chats.slice(0,30)))}
function draw(){chat.innerHTML="";msgs.forEach(m=>bubble(m));$("#welcome").style.display=msgs.length?"none":"";$("#cap").style.display=msgs.length?"none":"";chat.scrollTop=chat.scrollHeight}
function bubble(m){const d=document.createElement("div");d.className="m "+(m.role==="user"?"u":"");d.textContent=m.text||"";
  if(m.svg){const im=new Image(),bl=new Blob([m.svg],{type:"image/svg+xml"});im.src=URL.createObjectURL(bl);d.append(im);
    const b=document.createElement("button");b.className="sm";b.textContent="Save image";
    b.onclick=()=>{const a=document.createElement("a");a.href=im.src;a.download="gearo-art.svg";a.click()};d.append(b)}
  if(m.src&&m.src.length){const s=document.createElement("div");s.style.cssText="margin-top:8px;font-size:12px;opacity:.9";s.append("Sources: ");m.src.forEach(u=>{if(!/^https?:/.test(u.url))return;const a=document.createElement("a");a.href=u.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=(u.title||u.url).slice(0,38);a.style.cssText="color:var(--acc);margin-right:10px";s.append(a)});d.append(s)}
  if(m.img){const im=new Image();im.src=m.img;d.append(im);const b=document.createElement("button");b.className="sm";b.textContent="Save image";b.onclick=()=>{const a=document.createElement("a");a.href=m.img;a.download="gearo-art.jpg";a.click()};d.append(b)}
  chat.append(d);chat.scrollTop=chat.scrollHeight;return d}
function newChat(){msgs=[];hist=[];docs=[];cid=null;draw();$("#side").classList.remove("open")}
$("#nNew").onclick=newChat;
$("#nUp").onclick=()=>{$("#fin").click();$("#side").classList.remove("open")};
$("#nHist").onclick=()=>{$("#side").classList.remove("open");
  modal("<h3>Chat History</h3><div id='hl'></div>",b=>{const l=b.querySelector("#hl");
    if(!chats.length)l.textContent="No chats yet. Start a voyage!";
    chats.forEach(c=>{const r=document.createElement("div");r.className="row";r.innerHTML="<span></span><button class='sm'>✕</button>";
      r.firstChild.textContent=c.title;
      r.onclick=()=>{cid=c.id;docs=[];msgs=c.msgs;hist=msgs.filter(m=>!m.svg).map(m=>({role:m.role,content:m.text}));draw();$("#modal").classList.remove("show")};
      r.lastChild.onclick=e=>{e.stopPropagation();chats=chats.filter(x=>x.id!==c.id);ls.s("gearo-chats",JSON.stringify(chats));r.remove()};l.append(r)})})};
$("#nSet").onclick=()=>{$("#side").classList.remove("open");
  modal("<h3>Settings</h3><div class='row' id='sb'>🖼️ Use my own background image</div><div class='row'>Background dimming <input type='range' id='dm' min='0' max='.7' step='.05'></div><div class='row' id='sc'>🗑️ Clear all chat history</div>",b=>{
    b.querySelector("#sb").onclick=pickBg;const d=b.querySelector("#dm");d.value=ls.g("gearo-dim")||".1";
    d.oninput=()=>{root.setProperty("--dim",d.value);ls.s("gearo-dim",d.value)};
    b.querySelector("#sc").onclick=()=>{chats=[];ls.s("gearo-chats","[]");b.querySelector("#sc").textContent="History cleared"}})};
$("#nAbout").onclick=()=>{$("#side").classList.remove("open");
  modal("<h3>About GEARO</h3><p>GEARO is your AI companion on the Grand Line. Chat, upload files, create images and switch crew themes: Luffy, Zoro, Shanks, Sanji, Law and Doflamingo.</p>")};

document.querySelectorAll(".q").forEach(b=>b.onclick=()=>{
  if(b.dataset.img){imgMode=true;$("#img").classList.add("on");inp.placeholder="Describe the image to create...";inp.focus()}
  else{inp.value=b.dataset.p;inp.focus()}});
$("#attach").onclick=()=>$("#fin").click();
$("#fin").onchange=e=>{[...e.target.files].forEach(f=>pend.push(f));e.target.value="";drawFiles()};
function drawFiles(){const box=$("#files");box.innerHTML="";pend.forEach((f,i)=>{const b=document.createElement("button");b.className="sm";b.textContent="📄 "+f.name.slice(0,22)+" ✕";b.onclick=()=>{pend.splice(i,1);drawFiles()};box.append(b)})}
$("#img").onclick=()=>{imgMode=!imgMode;$("#img").classList.toggle("on",imgMode);inp.placeholder=imgMode?"Describe the image to create...":"Type your message to GEARO..."};

const readText=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=()=>r("");x.readAsText(f)});

const b64=f=>new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(",")[1]);x.readAsDataURL(f)});
let docs=[];
function loadMammoth(){return window.mammoth?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js";s.onload=ok;s.onerror=()=>no(new Error("Could not load the Word reader. Try a PDF or TXT instead."));document.head.append(s)})}
async function docxText(f){await loadMammoth();const r=await mammoth.extractRawText({arrayBuffer:await f.arrayBuffer()});return r.value}
async function send(){
  const text=inp.value.trim();if(!text&&!pend.length)return;
  inp.value="";const files=pend.slice(),mode=imgMode;pend=[];drawFiles();
  msgs.push({role:"user",text:(mode?"🎨 ":"")+text+(files.length?"\n["+files.map(f=>f.name).join(", ")+"]":"")});
  const out={role:"assistant",text:mode?"Painting your image...":"Scanning the horizon..."};msgs.push(out);draw();
  try{
    let prompt=text,images=[];
    let total=0;
    for(const f of files){
      const n=f.name.toLowerCase();
      if(f.type.startsWith("image/")||n.endsWith(".pdf")){
        total+=f.size;if(total>3e6)throw new Error("Images and PDFs must total under 3 MB.");
        images.push({type:n.endsWith(".pdf")?"application/pdf":f.type,data:await b64(f)})}
      else if(n.endsWith(".docx"))prompt+="\n\n--- File: "+f.name+" ---\n"+(await docxText(f)).slice(0,50000);
      else if(/\.(doc|xls|xlsx|ppt|pptx)$/.test(n))throw new Error("Please save "+f.name+" as PDF, DOCX or TXT first.");
      else{const t=await readText(f);if(t.slice(0,2000).indexOf("\u0000")>-1)throw new Error("I cannot read "+f.name+". Use PDF, DOCX, TXT or CSV.");prompt+="\n\n--- File: "+f.name+" ---\n"+t.slice(0,50000)}}
    if(!text)prompt="Please read the attached file(s) and give me a short summary."+prompt;
    if(images.length)docs=images;
    if(mode){try{const ri=await fetch("/api/image",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:text})});const ji=await ri.json();if(ri.ok&&ji.image){out.text="";out.img=ji.image;hist.push({role:"user",content:text},{role:"assistant",content:"[Created an image: "+text+"]"});draw();save();return}}catch(e){}}
    if(mode)prompt="Create a vivid, polished SVG illustration (viewBox 0 0 800 600, no external references, no scripts) of: "+text+"\nReturn ONLY the <svg>...</svg> markup.";
    const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:hist.concat([{role:"user",content:prompt}]),images:mode?[]:docs,search:!mode})});
    const j=await r.json();if(!r.ok)throw new Error(j.error||"Request failed");
    if(mode){const m=j.text.match(/<svg[\s\S]*<\/svg>/i);
      if(m){out.text="";out.svg=m[0]}else out.text="The sea was too rough. Try describing the image again.";
      hist.push({role:"user",content:text},{role:"assistant",content:"[Created an image: "+text+"]"})}
    else{out.text=j.text;out.src=j.sources||[];hist.push({role:"user",content:prompt},{role:"assistant",content:j.text})}
  }catch(e){out.text="Something went wrong: "+((e&&e.message)||"unknown error")}
  draw();save();
}
$("#send").onclick=send;
inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send()}});
draw();
</script>
</body>
</html>
